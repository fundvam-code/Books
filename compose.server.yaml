services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите пароль PostgreSQL}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dashboard", "-d", "dashboard"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите пароль PostgreSQL}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Укажите домен}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?Укажите секрет агента}
      LABEL_DIR: /labels
      BOOK_STORAGE_SHEET_ID: ${BOOK_STORAGE_SHEET_ID:-}
      BOOK_STORAGE_SHEET_GID: ${BOOK_STORAGE_SHEET_GID:-1001}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - labels:/labels
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Укажите домен}
      DASHBOARD_TLS_MODE: ${DASHBOARD_TLS_MODE:-default}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?Укажите имя пользователя}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?Укажите хеш пароля}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  database:
  labels:
  caddy_data:
  caddy_config:
