services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - path: ${OZON_ENV_FILE:-.env.ozon}
        required: false
        format: raw
      - path: .env.wb
        required: false
        format: raw
    environment:
      DASHBOARD_URL: ${DASHBOARD_URL:?Укажите адрес дашборда}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?Укажите секрет агента}
    restart: unless-stopped
