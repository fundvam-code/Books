<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Заказы FBS{% endblock %}</title>
  <link rel="stylesheet" href="/static/dashboard.css?v=10">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a href="/orders"><span>Заказы <small>FBS</small></span></a>
    <a href="/monitoring">Мониторинг</a>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
  <aside class="order-notices" aria-label="Очередь операций"></aside>
  <template id="order-notice">
    <section class="order-notice">
      <header>
        <strong data-status-title></strong>
        <button type="button" data-status-close aria-label="Закрыть" hidden>×</button>
      </header>
      <p data-status-message role="status"></p>
      <a data-status-link hidden>Открыть статус</a>
    </section>
  </template>
  <script src="/static/status-modal.js?v=4" defer></script>
</body>
</html>
