<div class="assembly-actions">
  {% set return_query = orders_query(account|default(order.account_key), hide_printed|default(false), hide_waiting|default(true)) %}
  <a class="button secondary" href="/orders/w/{{ order.posting_number }}/assembly?{{ return_query }}">Собрать</a>
  <form action="/orders/w/{{ order.posting_number }}/assembly?{{ return_query }}" method="post">
    <button class="button" type="submit" name="print_after" value="true">Собрать и напечатать</button>
  </form>
</div>
